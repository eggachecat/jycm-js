on:
  push:
    branches: [main]
  pull_request:

name: Test Coveralls

jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:

    - uses: actions/checkout@v5

    - name: Use Node.js 20.x
      uses: actions/setup-node@v5
      with:
        node-version: 20.x
        package-manager-cache: false

    - name: npm install, make test-coverage
      run: |
        npm install
        npm run test

    - name: Coveralls
      uses: coverallsapp/github-action@v2
